services:
  cs162:
    container_name: cs162
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    tty: true
    volumes:
      - ./.workspace:/home/workspace
    networks:
      cs162:
        # I have `"iptables": false`.
        ipv4_address: 172.28.0.10

networks:
  cs162:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-cs162
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
